<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1a1a2e 0%, #000 70%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }
    canvas { position: fixed; inset: 0; z-index: 0; }
    .card {
      position: relative;
      z-index: 1;
      max-width: 420px;
      width: 100%;
      padding: 36px 28px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(102,126,234,0.4);
    }
    h1 { font-size: 22px; margin-bottom: 6px; font-weight: 600; }
    .sub { color: #888; font-size: 13px; margin-bottom: 28px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fbbf24;
      animation: pulse 1.5s infinite;
    }
    .dot.ok { background: #10b981; animation: none; }
    .dot.err { background: #ef4444; animation: none; }
    @keyframes pulse { 50% { opacity: 0.3; } }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: #555;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <canvas id="stars"></canvas>

  <div class="card">
    <div class="avatar" id="avatar">👤</div>
    <h1 id="name">جاري التحميل...</h1>
    <div class="sub" id="sub">...</div>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status-text">جاري التسجيل...</span>
    </div>

    <button class="btn" onclick="closeApp()">إغلاق التطبيق</button>

    <div class="footer">
      باستخدامك التطبيق توافق على تسجيل بيانات تقنية لأغراض الحماية والإحصاء.
    </div>
  </div>

  <script>
    // ═══ نجوم متلألئة ═══
    const c = document.getElementById('stars');
    const ctx = c.getContext('2d');
    let stars = [];

    function resize() {
      c.width = innerWidth;
      c.height = innerHeight;
      stars = Array.from({length: 100}, () => ({
        x: Math.random() * c.width,
        y: Math.random() * c.height,
        r: Math.random() * 1.5 + 0.3,
        a: Math.random() * Math.PI,
        v: Math.random() * 0.02 + 0.005,
      }));
    }

    function draw() {
      ctx.clearRect(0, 0, c.width, c.height);
      for (const s of stars) {
        s.a += s.v;
        const alpha = 0.3 + Math.abs(Math.sin(s.a)) * 0.7;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }

    addEventListener('resize', resize);
    resize();
    draw();

    // ═══ Telegram ═══
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const user = tg?.initDataUnsafe?.user || {};

    document.getElementById('name').textContent =
      user.first_name ? `${user.first_name}${user.last_name ? ' ' + user.last_name : ''}` : 'زائر';
    document.getElementById('sub').textContent =
      user.username ? `@${user.username}` : `ID: ${user.id || '—'}`;

    // ═══ إرسال البيانات ═══
    async function logVisit() {
      try {
        const res = await fetch('/api/visit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: user.id || null,
            username: user.username || null,
            first_name: user.first_name || null,
            last_name: user.last_name || null,
            language: user.language_code || null,
            is_premium: user.is_premium || false,
          }),
        });

        if (!res.ok) throw new Error('HTTP ' + res.status);

        document.getElementById('dot').className = 'dot ok';
        document.getElementById('status-text').textContent = 'تم التسجيل بنجاح';
      } catch (e) {
        document.getElementById('dot').className = 'dot err';
        document.getElementById('status-text').textContent = 'فشل التسجيل';
      }
    }

    logVisit();

    function closeApp() {
      tg?.close();
    }
  </script>
</body>
</html>
